name: Convert Images to WebP

on:
  push:
    branches:
      - main
    paths:
      - 'images/**/*.jpg'
      - 'images/**/*.jpeg'
      - 'images/**/*.JPG'
      - 'images/**/*.JPEG'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-to-webp:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های سایت
        uses: actions/checkout@v4

      - name: نصب ابزار WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: تبدیل عکس‌ها به WebP
        run: |
          find images -type f \( \
            -iname "*.jpg" -o \
            -iname "*.jpeg" \
          \) -print0 | while IFS= read -r -d '' file
          do
            output="${file%.*}.webp"

            echo "در حال تبدیل: $file"

            cwebp -quiet -q 80 "$file" -o "$output"
          done

      - name: ذخیره فایل‌های WebP در GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/*.webp

          if git diff --cached --quiet; then
            echo "فایل WebP جدیدی برای ذخیره وجود ندارد."
          else
            git commit -m "Convert images to optimized WebP"
            git push
          fi
