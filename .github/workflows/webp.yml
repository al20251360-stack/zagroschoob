name: Convert images to WebP

on:
  workflow_dispatch:

jobs:
  webp:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert JPG images to WebP
        run: |
          find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -print0 | while IFS= read -r -d '' file
          do
            output="${file%.*}.webp"
            echo "Converting: $file -> $output"
            cwebp -q 80 "$file" -o "$output"
          done

      - name: Save WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp
          git diff --cached --quiet || git commit -m "Convert images to WebP"
          git push
